name: Month Open Backfill (one-time)

# 手動1回用(Actionsタブ → Month Open Backfill → Run workflow)
# ETH/USD の各月1日(UTC)の日足始値を outputsize=600 で取得し、
# data/history/ETHUSD-month-open.json を作成する(追記専用・検証不合格なら保存しない)。
# 以降の追記は daily.yml が API 消費なしで行う。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run month-open backfill
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node scripts/month-open.js --backfill

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "month-open: backfill $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push || (git pull --rebase -X theirs origin main && git push)
