name: Daily Crypto Risk Feed

on:
  schedule:
    # 毎日 04:47 UTC = JST 13:47(暗号資産は土日も取引日のため7日運用)。
    # UTC暦日クローズ(00:00 UTC)後に実行。00:00-04:00 UTCはGitHub全体の
    # cron最混雑帯で間引きが激しいため意図的に外している(EA-Risk-Monitor §19と同じ知見)。
    - cron: "47 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily batch
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node scripts/daily.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push || (git pull --rebase -X theirs origin main && git push)
